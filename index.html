<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine GitHub Page + Game</title>
  <style>
    /* Grundlayout */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", system-ui, sans-serif;
      color: #f8fafc;
      background: #0f172a;
      overflow-x: hidden;
      /* Animierter Background-Gradient */
      background: linear-gradient(125deg, #0f172a, #1e293b, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Hero-Sektion */
    .hero {
      position: relative;
      padding: clamp(2rem, 5vw, 4rem) clamp(1rem, 6vw, 6rem);
      max-width: 1200px;
      margin: 0 auto;
      z-index: 2;
    }

    .hero__content { display: grid; gap: 2rem; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 0; }
    .subtitle { font-size: 1.1rem; max-width: 580px; color: #e2e8f0; }

    /* Cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.5rem;
      transition: transform 0.3s ease;
    }
    .card:hover { transform: translateY(-5px); }

    .btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      border-radius: 20px;
      font-weight: bold;
    }

    /* --- MINIGAME SEKTION --- */
    .game-container {
      margin: 4rem auto;
      max-width: 600px;
      text-align: center;
      position: relative;
    }

    #gameCanvas {
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid #38bdf8;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      max-width: 600px;
      display: block;
    }

    .game-info {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    /* Hintergrund-Partikel (Sterne) */
    .particles {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Partikel Hintergrund -->
  <canvas class="particles" id="particleCanvas"></canvas>

  <main class="hero">
    <div class="hero__content">
      <h1>Hallo, ich bin [Dein Name] 👋</h1>
      <p class="subtitle">Entwickler, Creator und Highscore-Jäger.</p>
      
      <div class="cards">
        <article class="card">
          <h2>⭐ Projekt</h2>
          <p>Mein aktuelles Highlight-Projekt auf GitHub.</p>
          <a href="#" class="btn">Ansehen</a>
        </article>
        <article class="card">
          <h2>🛠 Tech</h2>
          <p>HTML • CSS • JS • Fun</p>
        </article>
      </div>
    </div>

    <!-- Das Spiel -->
    <section class="game-container">
      <h3>🕹️ Mini-Game: Space Jump</h3>
      <canvas id="gameCanvas" width="600" height="150"></canvas>
      <p class="game-info">Klicke ins Feld oder drücke <b>Leertaste</b> zum Springen!</p>
    </section>
  </main>

  <script>
    // --- PARTIKEL HINTERGRUND ---
    const pCanvas = document.getElementById('particleCanvas');
    const pCtx = pCanvas.getContext('2d');
    let particles = [];

    function resize() {
      pCanvas.width = window.innerWidth;
      pCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for(let i=0; i<80; i++) {
      particles.push({
        x: Math.random() * pCanvas.width,
        y: Math.random() * pCanvas.height,
        size: Math.random() * 2,
        speed: Math.random() * 0.5 + 0.1
      });
    }

    function drawParticles() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      pCtx.fillStyle = "white";
      particles.forEach(p => {
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        pCtx.fill();
        p.y -= p.speed;
        if(p.y < 0) p.y = pCanvas.height;
      });
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // --- MINIGAME LOGIK ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let dino = { x: 50, y: 120, w: 20, h: 20, dy: 0, jumpPower: -8, grounded: true };
    let obstacles = [];
    let score = 0;
    let gameActive = false;
    let gravity = 0.4;

    function drawDino() {
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
    }

    function spawnObstacle() {
      if (Math.random() < 0.02) {
        obstacles.push({ x: canvas.width, y: 120, w: 15, h: 20, speed: 4 + (score / 100) });
      }
    }

    function update() {
      if (!gameActive) {
        ctx.fillStyle = "white";
        ctx.fillText("KLICKEN ZUM STARTEN", canvas.width/2 - 60, canvas.height/2);
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Boden-Linie
      ctx.strokeStyle = "#334155";
      ctx.beginPath(); ctx.moveTo(0, 140); ctx.lineTo(canvas.width, 140); ctx.stroke();

      // Dino Physik
      dino.dy += gravity;
      dino.y += dino.dy;
      if (dino.y > 120) {
        dino.y = 120;
        dino.dy = 0;
        dino.grounded = true;
      }

      drawDino();

      // Hindernisse
      obstacles.forEach((obs, index) => {
        obs.x -= obs.speed;
        ctx.fillStyle = "#f43f5e";
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

        // Kollision
        if (dino.x < obs.x + obs.w && dino.x + dino.w > obs.x && dino.y < obs.y + obs.h && dino.y + dino.h > obs.y) {
          gameActive = false;
          alert("Game Over! Score: " + score);
          obstacles = [];
          score = 0;
        }

        if (obs.x + obs.w < 0) {
          obstacles.splice(index, 1);
          score++;
        }
      });

      spawnObstacle();
      ctx.fillStyle = "white";
      ctx.fillText("Score: " + score, 10, 20);
      requestAnimationFrame(update);
    }

    function jump() {
      if (dino.grounded) {
        dino.dy = dino.jumpPower;
        dino.grounded = false;
        if (!gameActive) {
          gameActive = true;
          update();
        }
      }
    }

    window.addEventListener('keydown', (e) => { if(e.code === 'Space') jump(); });
    canvas.addEventListener('click', jump);
    update();
  </script>
</body>
</html>
